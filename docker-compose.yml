version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: pocket_site
    restart: always
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - ./site:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    command: >
      /bin/sh -c "
      envsubst '\$RECAPTCHA_SITE_KEY' 
      < /usr/share/nginx/html/review.html 
      > /usr/share/nginx/html/review.tmp &&
      mv /usr/share/nginx/html/review.tmp /usr/share/nginx/html/review.html &&
      nginx -g 'daemon off;'"

